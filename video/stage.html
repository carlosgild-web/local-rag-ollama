<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Local RAG: under the hood</title>
<!--
  The video stage (decision 0043, ported from luna-hybrid-agent and hl-bead-studio), served by
  the recorder at /__video/stage.html on the app's own origin: the real app runs unchanged in
  the iframe; this page only adds the "Under the hood" panel, the subtitles and the slides.
  Everything it shows comes from record.spec.ts (captured SSE events and API answers, the
  retrieval inspector's answer, lines.mjs excerpts). Colours: a dark slate and the console's
  teal.
-->
<style>
  :root {
    --ink: #eef3f2; --muted: #a9bcb9; --dim: #6c8582; --bg: #0f1c1d; --panel: #152829;
    --line: #26403f; --accent: #2dd4bf; --accent-ink: #0f1c1d; --warn: #7dd3fc; --code: #0a1415;
    --where-bg: #1b3334;
    --mono: "Cascadia Code", Consolas, "Courier New", monospace;
    --sans: "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  #app { position: absolute; left: 0; top: 0; width: 1280px; height: 960px; border: 0; background: #fff; }
  #panel { position: absolute; left: 1280px; top: 0; width: 640px; height: 960px; background: var(--panel);
           border-left: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 22px; gap: 14px; }
  #subs { position: absolute; left: 0; top: 960px; width: 1920px; height: 120px; background: #081011;
          display: flex; align-items: center; justify-content: center; padding: 0 120px;
          font-size: 30px; line-height: 1.3; text-align: center; color: #fff; }
  #subs:empty::before { content: ""; }

  .banner { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--muted); }
  .banner b { color: var(--accent-ink); background: var(--accent); padding: 3px 10px; border-radius: 99px; font-weight: 600; }
  .title { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }

  .pipeline { display: flex; flex-wrap: nowrap; gap: 4px; }
  .pipeline span { font-size: 12px; padding: 3px 6px; white-space: nowrap; border-radius: 6px; border: 1px solid var(--line); color: var(--dim); transition: all .25s; }
  .pipeline span.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .pipeline i { color: var(--dim); font-style: normal; align-self: center; font-size: 11px; }

  .row-id { font-family: var(--mono); font-size: 13px; color: var(--dim); }
  .callout { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .callout .where { font-family: var(--mono); font-size: 14px; padding: 6px 10px; background: var(--where-bg); color: var(--warn); }
  .callout pre { margin: 0; padding: 8px 10px; font-family: var(--mono); font-size: 12.5px; line-height: 1.45;
                 background: var(--code); color: #c9cde6; white-space: pre; overflow: hidden; max-height: 196px; }
  #callouts { display: flex; flex-direction: column; gap: 10px; }
  .payload { flex: 1; min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .payload .label { font-size: 13px; padding: 6px 10px; background: var(--where-bg); color: var(--accent); display: flex; justify-content: space-between; }
  .payload pre { margin: 0; flex: 1; padding: 8px 10px; font-family: var(--mono); font-size: 12.5px; line-height: 1.45;
                 background: var(--code); color: #e2e5f4; white-space: pre-wrap; word-break: break-word; overflow: hidden; }
  .payload.empty { display: none; }

  #slide { position: absolute; left: 0; top: 0; width: 1920px; height: 960px; background: var(--bg); display: none;
           align-items: center; justify-content: center; padding: 60px 120px; }
  #slide.on { display: flex; }
  #slide h1 { font-size: 64px; margin: 0 0 18px; font-weight: 650; }
  #slide h2 { font-size: 40px; margin: 0 0 28px; font-weight: 600; }
  #slide p.lead { font-size: 28px; color: var(--muted); margin: 0; }
  .slide-inner { width: 100%; max-width: 1560px; }
  .boxes { display: flex; align-items: stretch; gap: 18px; margin-top: 30px; }
  .box { flex: 1; border: 2px solid var(--line); border-radius: 14px; padding: 22px; min-height: 170px; background: var(--panel); }
  .box b { display: block; font-size: 26px; margin-bottom: 8px; }
  .box span { font-size: 19px; color: var(--muted); line-height: 1.4; }
  .box.hot { border-color: var(--accent); }
  .arrow { font-size: 36px; color: var(--dim); align-self: center; }
  ol.inv { font-size: 25px; line-height: 1.5; columns: 2; column-gap: 60px; padding-left: 36px; margin: 0; }
  ol.inv li { color: var(--dim); break-inside: avoid; margin-bottom: 10px; }
  ol.inv li.hot { color: var(--ink); }
  ol.inv li.hot::marker { color: var(--accent); }
  table.cmp { border-collapse: collapse; font-size: 22px; width: 100%; }
  table.cmp th, table.cmp td { border-bottom: 1px solid var(--line); padding: 14px 16px; text-align: left; vertical-align: top; }
  table.cmp th { color: var(--muted); font-weight: 600; }
  table.cmp tr.same td { color: var(--accent); font-weight: 600; }
  .counters { display: flex; gap: 24px; margin-bottom: 26px; }
  .counter { border: 2px solid var(--line); border-radius: 14px; padding: 18px 26px; background: var(--panel); min-width: 220px; }
  .counter b { display: block; font-size: 44px; font-family: var(--mono); }
  .counter span { color: var(--muted); font-size: 18px; }
  .steps { font-family: var(--mono); font-size: 18px; line-height: 1.6; color: #c9cde6; background: var(--code);
           border-radius: 10px; padding: 16px 20px; max-height: 470px; overflow: hidden; white-space: pre-wrap; }
</style>
</head>
<body>
  <iframe id="app" title="Local RAG (the real app)" src="about:blank"></iframe>
  <aside id="panel">
    <div class="banner"><b id="banner">…</b><span id="provider"></span></div>
    <div class="title">Under the hood</div>
    <div class="pipeline" id="pipeline"></div>
    <div class="row-id" id="row-id"></div>
    <div id="callouts"></div>
    <div class="payload empty" id="payload"><div class="label"><span id="payload-label"></span><span id="payload-note"></span></div><pre id="payload-json"></pre></div>
  </aside>
  <div id="slide"><div class="slide-inner" id="slide-inner"></div></div>
  <div id="subs"></div>
  <script src="stage.js"></script>
</body>
</html>
