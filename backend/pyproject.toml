[project]
name = "ollama-rag-backend"
version = "0.1.0"
description = "Local RAG backend (Ollama + FastAPI + ChromaDB)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
